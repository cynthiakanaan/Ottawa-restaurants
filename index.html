const TABS=[["all","All"],["d","Date night"],["c","Chill"],["t","Takeout"],["b","Bars"],["kf","Brunch & cafés"],["x","Avoid"]];
let geo=null;const st={tab:"all",q:"",cu:"",ar:"",pr:"",t:"",g:"",s:"n",rf:"",dm:"",v:"t"};let cur=null,editId=null,shown=[];
const inTab=(p,k)=>k=="all"?!p.cats.includes("x"):[...k].some(c=>p.cats.includes(c));
const city=p=>/Gatineau|Aylmer|Hull/.test(p.loc)?"Gatineau QC":/Chelsea/.test(p.loc)?"Chelsea QC":"Ottawa ON";
const mapUrl=p=>"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(p.name+" "+city(p));
const webUrl=p=>p.web?(/^https?:/.test(p.web)?p.web:"https://"+p.web):"https://www.google.com/search?q="+encodeURIComponent(p.name+" "+city(p)+" restaurant");
const photoUrl=p=>"https://www.google.com/search?tbm=isch&q="+encodeURIComponent(p.name+" "+city(p)+" restaurant food");
const rts=id=>Object.values(RT).map(m=>m[id]).filter(Boolean);
const avg=id=>{const r=rts(id);return r.length?r.reduce((a,b)=>a+b)/r.length:0};
const fail=()=>{if(!warned++)alert("This change is only saved on this device. To save it for everyone, ask for Contributor access to this page.")};
function persist(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}if(DB){clearTimeout(pt);pt=setTimeout(()=>{pt=0;DB.doc("app/places").set({list:S}).catch(fail)},400)}}
function rate(id,v){const m=RT[ME]=RT[ME]||{};if(m[id]==v)delete m[id];else m[id]=v;try{localStorage.setItem(KR,JSON.stringify(m))}catch(e){}if(DB)DB.collection("ratings").doc(ME).set({r:m}).catch(fail)}
const saveImg=()=>{try{localStorage.setItem(KI,JSON.stringify(imgs));return true}catch(e){alert("Storage is full. Remove a few photos.");return false}};

function row(p){
 const x=p.cats.includes("x"),n=rts(p.id).length;
 return `<tr class="g${p.go}" data-id="${p.id}"><td>${imgs[p.id]?`<span class="pic" style="background-image:url(${imgs[p.id]})"></span>`:""}<button class="nm" data-a="o">${esc(p.name)}</button></td><td>${esc(p.type)}</td><td>${esc(area(p))}${distTxt(p)}</td><td>${esc(p.price)}</td>
<td class="wide">${esc(p.known)}${p.notes?`<div class="nt">${esc(p.notes)}</div>`:""}</td>
<td><button class="pill ${x?"N":p.go}" data-a="go">${x?"Avoid":GOL[p.go]}</button><button class="pill ${p.tried=="Y"?"T":"U"}" data-a="t">${p.tried=="Y"?"✓ Tried":"Not yet"}</button></td>
<td class="rt">${n?`<b>★ ${avg(p.id).toFixed(1)}</b> <span>(${n})</span>`:"–"}</td>
<td><a href="${mapUrl(p)}" target="_blank" rel="noopener">Map</a><a href="${esc(webUrl(p))}" target="_blank" rel="noopener">${p.web?"Site":"Find site"}</a></td></tr>`}

function opts(id,label,list,val){const e=$(id);e.innerHTML=`<option value="">${label}</option>`+list.map(([v,c])=>`<option value="${esc(v)}">${esc(v)} (${c})</option>`).join("");e.value=val}
function render(){
 const q=st.q.toLowerCase(),has=(p,c)=>p.type.toLowerCase().includes(c.toLowerCase());
 const base=S.filter(p=>(!q||[p.name,p.type,p.loc,p.price,p.known,p.notes].join(" ").toLowerCase().includes(q))&&(q||inTab(p,st.tab))&&(!q||st.tab=="all"||inTab(p,st.tab)));
 opts("#fcu","All cuisines",CUIS.map(c=>[c,base.filter(p=>has(p,c)).length]).filter(a=>a[1]),st.cu);
 opts("#far","All areas",[...new Set(base.map(area))].sort().map(a=>[a,base.filter(p=>area(p)==a).length]),st.ar);
 $("#th").innerHTML=[["n","Place"],["y","Cuisine"],["a","Area"],["","Price"],["","Known for & notes"],["g","Status"],["r","Rating"],["","Links"]].map(([k,l])=>`<th>${k?`<button class="hb${st.s==k?" on":""}" data-s="${k}">${l}${st.s==k?" ▾":""}</button>`:l}</th>`).join("");
 $("#tabs").innerHTML=TABS.map(([k,l])=>`<button class="tab${st.tab==k?" on":""}" data-tab="${k}">${l}</button>`).join("");
 const o={Y:0,M:1,N:2},n=(a,b)=>a.name.localeCompare(b.name);
 const r=base.filter(p=>(!st.cu||has(p,st.cu))&&(!st.ar||area(p)==st.ar)&&(!st.pr||tier(p)==st.pr)&&(!st.t||p.tried==st.t)&&(!st.g||p.go==st.g)&&(!st.dm||!refPt()||(dist(p)!=null&&dist(p)<=+st.dm)))
  .sort((a,b)=>st.s=="d"?(dd(a)-dd(b))||n(a,b):st.s=="r"?(avg(b.id)-avg(a.id))||n(a,b):st.s=="g"?(o[a.go]-o[b.go])||n(a,b):st.s=="y"?a.type.localeCompare(b.type)||n(a,b):st.s=="a"?area(a).localeCompare(area(b))||n(a,b):n(a,b));
 $("#list").innerHTML=r.length?r.map(row).join(""):`<tr><td colspan="8" class="empty">Nothing matches. Clear a filter or add a place.</td></tr>`;
 $("#tw").style.display=st.v=="t"?"":"none";$("#mw").style.display=st.v=="m"?"":"none";$("#vt").textContent=st.v=="t"?"Map view":"Table view";if(st.v=="m")$("#mw").innerHTML=mapSvg(r);
 shown=r;$("#cnt").textContent=r.length+" place"+(r.length==1?"":"s");
}
function sheet(){
 const p=S.find(x=>x.id==cur);if(!p)return;
 const mine=(RT[ME]||{})[p.id]||0,im=imgs[p.id];
 const stars=[1,2,3,4,5].map(v=>`<button class="st${mine>=v?" on":""}" data-a="rate" data-v="${v}" aria-label="Rate ${v}">★</button>`).join("");
 const others=Object.keys(RT).filter(u=>u!=ME&&RT[u][p.id]).map(u=>`<div class="rr"><span>${esc(NAMES[u]||"Someone")}</span><span class="rs">${"★".repeat(RT[u][p.id])}${"☆".repeat(5-RT[u][p.id])}</span></div>`).join("");
 const seg=(a,c,o)=>`<div class="seg">${o.map(([v,l])=>`<button class="${c==v?"on":""}" data-a="${a}" data-v="${v}">${l}</button>`).join("")}</div>`;
 $("#sh").innerHTML=`<div class="sp2">${im?`<div class="hero" style="background-image:url(${im})"></div>`:""}
<h2>${esc(p.name)}</h2><div class="sub">${[p.type,p.loc,p.price].filter(Boolean).map(esc).join(" · ")||"&nbsp;"}</div>
<div class="lbl">Your rating</div><div>${stars}</div>${others?`<div class="lbl">Others</div>${others}`:""}
<div class="lbl">Tried it?</div>${seg("tried",p.tried,[["N","Not yet"],["Y","Tried"]])}
<div class="lbl">Would go?</div>${seg("go",p.go,[["Y","Yes"],["M","Maybe"],["N","Not keen"]])}
${p.known?`<p class="txt">${esc(p.known)}</p>`:""}${p.notes?`<p class="txt mute">${esc(p.notes)}</p>`:""}
<div class="links"><a href="${mapUrl(p)}" target="_blank" rel="noopener">Open in Maps</a><a href="${esc(webUrl(p))}" target="_blank" rel="noopener">${p.web?"Website":"Find website"}</a><a href="${photoUrl(p)}" target="_blank" rel="noopener">Find photos</a></div>
${im?"":`<div class="nt" style="margin-top:10px">Tip: open Find photos or Maps, copy an image, then paste it here (Ctrl/Cmd+V) or drop an image file onto this card.</div>`}<div class="foot"><span><label class="lk" style="display:inline;margin:0">${im?"Change photo":"Add photo"}<input type="file" accept="image/*" hidden id="ph"></label>${im?` &nbsp;<button data-a="rmph">Remove</button>`:""}</span>
<span><button data-a="edit">Edit</button> &nbsp; <button data-a="del">Delete</button> &nbsp; <button data-a="close" style="color:var(--ink);font-weight:600">Done</button></span></div></div>`;
}
const openSheet=id=>{cur=id;sheet();$("#sh").showModal()};
function resize(f,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,480/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",.6))};im.src=r.result};r.readAsDataURL(f)}

$("#list").onclick=e=>{
 const c=e.target.closest("tr");if(!c||e.target.closest("a"))return;
 const id=+c.dataset.id,b=e.target.closest("[data-a]"),a=b&&b.dataset.a,p=S.find(x=>x.id==id);
 if(a=="t")p.tried=p.tried=="Y"?"N":"Y";else if(a=="go")p.go={Y:"M",M:"N",N:"Y"}[p.go];else return openSheet(id);
 persist();render();
};
$("#th").onclick=e=>{const b=e.target.closest("[data-s]");if(b){st.s=b.dataset.s;render()}};
$("#tabs").onclick=e=>{const b=e.target.closest("[data-tab]");if(b){st.tab=b.dataset.tab;render()}};
$("#q").oninput=e=>{st.q=e.target.value;render()};
[["#fcu","cu"],["#far","ar"],["#fpr","pr"],["#ft","t"],["#fg","g"]].forEach(([i,k])=>$(i).onchange=e=>{st[k]=e.target.value;render()});
$("#ftg").onclick=()=>$("#fl").classList.toggle("on");
$("#clr").onclick=()=>{Object.assign(st,{q:"",cu:"",ar:"",pr:"",t:"",g:"",rf:"",dm:"",s:"n"});$("#q").value="";["#fpr","#ft","#fg","#frf","#fdm"].forEach(i=>$(i).value="");render()};
$("#vt").onclick=()=>{st.v=st.v=="t"?"m":"t";render()};
$("#mw").onclick=e=>{const g=e.target.closest("[data-id]");if(g)openSheet(+g.dataset.id)};
$("#frf").innerHTML='<option value="">Distance from…</option>'+Object.keys(AC).map(a=>`<option>${a}</option>`).join("")+'<option value="me">My location</option>';
$("#frf").onchange=e=>{const v=e.target.value;if(v=="me"){if(!navigator.geolocation){alert("Location isn't available here. Pick a neighbourhood instead.");e.target.value=st.rf;return}navigator.geolocation.getCurrentPosition(q=>{geo=[q.coords.latitude,q.coords.longitude];st.rf="me";st.s="d";render()},()=>{alert("Couldn't get your location. Pick a neighbourhood instead.");e.target.value=st.rf})}else{st.rf=v;st.s=v?"d":"n";if(!v)st.dm="";$("#fdm").value=st.dm;render()}};
$("#fdm").onchange=e=>{if(e.target.value&&!st.rf){alert("Choose \"Distance from…\" first.");e.target.value="";return}st.dm=e.target.value;render()};
$("#rnd").onclick=()=>{const c=shown.filter(p=>p.tried=="N"&&p.go=="Y"),a=c.length?c:shown;if(a.length)openSheet(a[Math.floor(Math.random()*a.length)].id)};
$("#sh").onclick=e=>{
 if(e.target==$("#sh"))return $("#sh").close();
 const b=e.target.closest("[data-a]");if(!b)return;
 const p=S.find(x=>x.id==cur),a=b.dataset.a,v=b.dataset.v;
 if(a=="close")return $("#sh").close();
 if(a=="edit"){$("#sh").close();return openEd(cur)}
 if(a=="del"){if(!confirm(`Delete "${p.name}"?`))return;S=S.filter(x=>x.id!=cur);delete imgs[cur];if(DB)DB.doc("photos/"+cur).delete().catch(()=>{});else saveImg();persist();$("#sh").close();return render()}
 if(a=="rate")rate(cur,+v);
 if(a=="tried"){p.tried=v;persist()}if(a=="go"){p.go=v;persist()}
 if(a=="rmph"){delete imgs[cur];if(DB)DB.doc("photos/"+cur).delete().catch(fail);else saveImg()}
 sheet();render();
};
$("#sh").onchange=e=>{if(e.target.id!="ph"||!e.target.files[0])return;resize(e.target.files[0],d=>{const id=cur;imgs[id]=d;if(DB)DB.doc("photos/"+id).set({d}).catch(fail);else saveImg();sheet();render()})};
const addImg=f=>{if(f&&cur!=null&&/^image\//.test(f.type))resize(f,d=>{const id=cur;imgs[id]=d;if(DB)DB.doc("photos/"+id).set({d}).catch(fail);else saveImg();sheet();render()})};
$("#sh").addEventListener("paste",e=>{const i=[...((e.clipboardData&&e.clipboardData.items)||[])].find(x=>x.type.startsWith("image/"));if(i){e.preventDefault();addImg(i.getAsFile())}});
$("#sh").addEventListener("dragover",e=>e.preventDefault());
$("#sh").addEventListener("drop",e=>{e.preventDefault();addImg(e.dataTransfer.files[0])});
function openEd(id){
 editId=id;const p=id?S.find(x=>x.id==id):{name:"",cats:/^[a-z]$/.test(st.tab)?st.tab:"d",type:"",loc:"",price:"",web:"",known:"",notes:""};
 $("#eh").textContent=id?"Edit place":"Add place";
 $("#fn").value=p.name;$("#fy").value=p.type;$("#fa").value=p.loc;$("#fp").value=p.price;$("#fw").value=p.web;$("#fk").value=p.known;$("#fno").value=p.notes;
 $("#fc").innerHTML=Object.entries(CATS).map(([k,l])=>`<label><input type="checkbox" value="${k}"${p.cats.includes(k)?" checked":""}>${l}</label>`).join("");
 $("#ed").showModal();
}
$("#add").onclick=()=>openEd(null);
$("#ec").onclick=()=>$("#ed").close();
$("#es").onclick=()=>{
 const name=$("#fn").value.trim();if(!name){$("#fn").focus();return}
 const cats=[...document.querySelectorAll("#fc input:checked")].map(i=>i.value).join("")||"d";
 const v={name,cats,type:$("#fy").value.trim(),loc:$("#fa").value.trim(),price:$("#fp").value.trim(),web:$("#fw").value.trim(),known:$("#fk").value.trim(),notes:$("#fno").value.trim()};
 let id=editId;
 if(id)Object.assign(S.find(x=>x.id==id),v);else{id=Math.max(0,...S.map(x=>x.id))+1;S.push({id,tried:"N",go:"Y",...v})}
 persist();$("#ed").close();render();openSheet(id);
};
render();
// Shared mode: places + per-person ratings sync when the page runs with db + user access
(async()=>{try{
 const c=window.claude;if(!c)return;
 const [d,u]=await Promise.all([c.use("db"),c.use("user")]);if(!d||!u)return;
 const id=await u.id();if(!id)return;
 ME=id;DB=d;NAMES[ME]="You";
 d.doc("app/places").onSnapshot(s=>{if(s.exists){if(!pt)S=(s.data().list||S)}else d.doc("app/places").set({list:S}).catch(()=>{});render();if($("#sh").open)sheet()},()=>{});
 d.collection("ratings").onSnapshot(async s=>{
  const R={};s.docs.forEach(x=>R[x.id]=(x.data()||{}).r||{});
  if(!R[ME]&&Object.keys(L).length){R[ME]=L;d.collection("ratings").doc(ME).set({r:L}).catch(()=>{})}
  RT=R;render();if($("#sh").open)sheet();
  try{const ps=await u.profiles(Object.keys(R));for(const k in ps)NAMES[k]=ps[k].isMe?"You":(ps[k].name||"Someone");render();if($("#sh").open)sheet()}catch(e){}
 },()=>{});
d.collection("photos").onSnapshot(s=>{const m={};s.docs.forEach(x=>{const v=(x.data()||{}).d;if(v)m[x.id]=v});imgs=m;render();if($("#sh").open)sheet()},()=>{});
}catch(e){}})();
</script></body></html>
