<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our Eats</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f6fa;--card:#fff;--ink:#1f1b2e;--mute:#7a748f;--line:#e6e2ef;--acc:#8e2a52;--acc2:#f3e1ea;--y:#23794a;--m:#a06b00;--n:#b03a3a;--star:#e0a21b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16131f;--card:#211d2d;--ink:#f0ecf7;--mute:#a69fbc;--line:#342e45;--acc:#e27aa3;--acc2:#3a2233;--y:#6cc28b;--m:#e0b152;--n:#e57a7a}}
:root[data-theme="dark"]{--bg:#16131f;--card:#211d2d;--ink:#f0ecf7;--mute:#a69fbc;--line:#342e45;--acc:#e27aa3;--acc2:#3a2233;--y:#6cc28b;--m:#e0b152;--n:#e57a7a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px 60px}
header{padding:30px 0 14px;display:flex;justify-content:space-between;align-items:center}
h1{font:800 34px/1 "Bricolage Grotesque",Georgia,sans-serif;margin:0;letter-spacing:-.02em}
.add{border:0;background:var(--acc);color:#fff;border-radius:99px;padding:9px 18px;font-weight:600;cursor:pointer}
.search{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px}
.tabs{display:flex;gap:20px;overflow-x:auto;margin-top:12px;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;padding:10px 0;color:var(--mute);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--ink);font-weight:600;border-color:var(--acc)}
.bar{display:flex;justify-content:space-between;align-items:center;margin:12px 0 4px;color:var(--mute);font-size:14px}
.lk{border:0;background:none;color:var(--acc);cursor:pointer;padding:0;font-size:14px}
.filters{display:flex;gap:8px;margin:10px 0 0}
.filters select{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-top:6px}
table{border-collapse:collapse;width:100%;min-width:1000px;font-size:14px}
th{text-align:left;font-weight:600;color:var(--mute);padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.hb{border:0;background:none;padding:0;font:inherit;font-weight:600;color:var(--mute);cursor:pointer}.hb.on{color:var(--acc)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr{cursor:pointer}tbody tr:last-child td{border-bottom:0}tbody tr:hover td{background:var(--acc2)}
td:first-child,th:first-child{position:sticky;left:0;background:var(--card);min-width:170px}
tr.gY td:first-child{box-shadow:inset 4px 0 0 var(--y)}tr.gM td:first-child{box-shadow:inset 4px 0 0 var(--m)}tr.gN td:first-child{box-shadow:inset 4px 0 0 var(--n)}
.nm{border:0;background:none;padding:0 0 0 4px;color:var(--ink);font:700 15px/1.3 "Bricolage Grotesque",Georgia,sans-serif;text-align:left;cursor:pointer}
.pic{display:inline-block;width:30px;height:30px;border-radius:6px;background:var(--acc2) center/cover;vertical-align:middle;margin-right:6px}
.wide{min-width:280px}.nt{color:var(--mute);font-size:13px}
.ms{white-space:nowrap}.mst{border:0;background:none;padding:0;font-size:16px;color:var(--line);cursor:pointer}.mst.on{color:var(--star)}
.pill{border:1px solid var(--line);background:none;border-radius:99px;padding:1px 10px;font-size:12.5px;color:var(--mute);cursor:pointer;white-space:nowrap}
.pill.Y{color:var(--y);border-color:var(--y)}.pill.M{color:var(--m);border-color:var(--m)}.pill.N{color:var(--n);border-color:var(--n)}
td a{color:var(--acc);text-decoration:none;margin-right:10px}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:50px 0}
footer{text-align:center;margin-top:28px}
dialog{border:0;border-radius:16px;background:var(--card);color:var(--ink);width:min(480px,94vw);max-height:90vh;padding:0}
dialog::backdrop{background:rgba(0,0,0,.5)}
.sp{padding:20px}
.hero{height:190px;margin:-20px -20px 14px;background:var(--acc2) center/cover}
h2{margin:0;font:800 26px/1.15 "Bricolage Grotesque",Georgia,sans-serif}
.sub{color:var(--mute);margin:4px 0 12px}
.big{font-size:30px;line-height:1;margin:6px 0 14px}
.st{border:0;background:none;padding:0 2px 0 0;font-size:30px;color:var(--line);cursor:pointer}.st.on{color:var(--star)}
.lbl{font-size:13px;color:var(--mute);margin:12px 0 5px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:none;padding:8px;cursor:pointer;color:var(--mute)}
.seg button.on{background:var(--acc);color:#fff}
.txt{margin:12px 0 0}.mute{color:var(--mute)}
.links{display:flex;gap:10px;margin-top:16px}
.links a{flex:1;text-align:center;border:1px solid var(--line);border-radius:10px;padding:9px;color:var(--ink);text-decoration:none}
.foot{display:flex;justify-content:space-between;margin-top:18px;padding-top:12px;border-top:1px solid var(--line)}
.foot button{border:0;background:none;color:var(--mute);cursor:pointer;padding:4px 0}
dialog label{display:block;font-size:13px;color:var(--mute);margin-top:10px}
dialog input[type=text],dialog textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 11px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cb{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:4px}.cb label{margin:0;color:var(--ink);display:flex;gap:5px;align-items:center;font-size:14px}
.btns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.btn{border:1px solid var(--line);background:none;border-radius:10px;padding:8px 16px;cursor:pointer}.btn.p{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style></head><body>
<div class="wrap">
<header><div><h1>Our Eats</h1></div><button class="add" id="add">+ Add place</button></header>
<input class="search" id="q" type="search" placeholder="Search places, cuisines, areas…" aria-label="Search">
<nav class="tabs" id="tabs"></nav>
<div class="filters">
<select id="ft" aria-label="Tried"><option value="">Tried or not</option><option value="Y">Tried</option><option value="N">Not yet</option></select>
<select id="fg" aria-label="Would go"><option value="">Would go: any</option><option value="Y">Yes</option><option value="M">Maybe</option><option value="N">No</option></select>
</div>
<div class="bar"><span id="cnt"></span><button class="lk" id="rnd">Surprise me</button></div>
<div class="tw"><table><thead><tr id="th"></tr></thead><tbody id="list"></tbody></table></div>
<footer><button class="lk" id="bk">Backup &amp; restore</button></footer>
</div>

<dialog id="sh"></dialog>

<dialog id="ed"><div class="sp"><h2 id="eh">Add place</h2>
<label>Name<input type="text" id="fn"></label>
<div class="g2"><label>Cuisine<input type="text" id="fy"></label><label>Area<input type="text" id="fa"></label></div>
<div class="g2"><label>Price<input type="text" id="fp" placeholder="$$ or $20-40"></label><label>Website<input type="text" id="fw" placeholder="optional"></label></div>
<label>Show under</label><div class="cb" id="fc"></div>
<label>Known for<input type="text" id="fk"></label>
<label>Notes<textarea id="fno" rows="3"></textarea></label>
<div class="btns"><button class="btn" id="ec">Cancel</button><button class="btn p" id="es">Save</button></div></div></dialog>

<dialog id="bd"><div class="sp"><h2>Backup &amp; restore</h2>
<p class="mute">Your list lives in this browser only. Copy this text somewhere safe, or paste a backup here to restore it.</p>
<textarea id="bt" rows="7" style="width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px"></textarea>
<div class="btns"><button class="btn" id="br">Reset to original</button><button class="btn" id="bl">Restore pasted</button><button class="btn p" id="bc">Close</button></div></div></dialog>

<script>
const CATS={d:"Date night",c:"Chill",t:"Takeout",b:"Bars",k:"Brunch",f:"Cafés",x:"Avoid"};
// name, lists, type, area, price, tried, go, known for, notes
const D=[
["Amicci","dct","Greek / Pizza","Gatineau","","Y","Y","Huge Greek platters, low price; pizzas","BEST; my family ❤️"],

["Elise","d","French","Westboro","$$","Y","M","","Went when it first opened; think the food was mid"],

["Shinka","d","Sushi","","$$","Y","Y","Incredible sushi","Tried as takeout"],
["Dalgonae","d","Korean BBQ","Chinatown (Somerset)","$30-40","Y","Y","BEST BBQ","Priced per item but BEST meat"],
["Paper Tiger","d","Ramen","Old Ottawa South","$","N","Y"],

["Arlo","dc","Seafood","Somerset (Centretown)","$$","N","M","Wine / cocktails"],
["Lavender Grill","c","Italian","Byward","$","Y","M","Gnocchi"],
["Retro Gusto","c","Pizza","Little Italy & Preston","$30-70","Y","M","Pizza Salamino","Good for pizza. Avoid the suppli (tasted frozen). Closes 10:30/11pm"],
["Nunna's Hot Chicken","ct","Fast food / Canadian","Hintonburg (Armstrong)","$10-20","Y","M","BEST fried chicken AND sauce; everything was incredible","Not for a date"],

["Kuidaore","c","Ramen","Little Italy","$$","Y","Y","","Visuals not so great"],

["Malak al Tawouk","t","Lebanese","Hintonburg & Wellington Village","$","Y","Y","The $13 OG sandwich"],
["Aladdin","t","Lebanese","","","Y","Y"],

["Scores","t","Canadian","Gatineau","$","Y","Y","Chipotle wrap"],

["Fifth Ave Wine Bar","b","Wine bar + bites","Glebe","$","N","Y","Cocktails / wine"],
["Parlour","b","Cocktail bar","Wellington","$","N","Y"],
["Buvette Daphnée","b","Wine bar","Byward","$$","N","Y","","Sharing plates, good mocktails"],
["Moonroom","b","Cocktail lounge","Little Italy & Preston","","N","Y","","Mainly drinks; the patio is such a vibe"],
["Natural History","b","Bar","Little Italy","","N","M","","More for a chill night than romantic; actually looks like the museum"],
["Trio Bistro and Lounge","b","Wine & cocktail bar","Westboro","$20-70","Y","M","Romantic, intimate atmosphere","Mainly drinks; food was not good (went on NYE); not that memorable"],
["Sidecar","b","Cocktail lounge","Little Italy & Preston","","N","M","","Rated 3.7 on Google by 19 people"],
["The Rabbit Hole","b","Cocktail bar","Centretown","$$","Y","M","Speakeasy (very hard to get in)","Go for the drinks; food was mid (years ago)"],
["Union Local 613","b","Bar","Somerset (Centretown)","$","Y","M","Hidden downstairs bar. Ask to go down!","Food sucks, except the berry dessert/cake"],
["Tavern on the Hill","b","Canadian bar","New Edinburgh","","Y","Y","","Seems more like drinks"],
["Tavern at the Gallery","b","Canadian bar","Major Hill Park (Rideau)","","N","Y","","Never been; seems more like drinks, atmosphere looks nice"],
["Wild Oat","k","Breakfast + lunch","Glebe","$","N","Y","Breakfast sandwich, goat cheese croissant"],
["Bobino","k","Bagels","Gatineau (St-Joseph)","$","Y","Y","BEST bagel; breakfast bagel","You'll never touch Kettleman's or St-Viateur again"],
["Art Is In","kf","Bakery","City Centre & Lebreton Flats","$$ 30","Y","Y","Thai chicken sandwich w/ sweet potatoes; croustade aux pommes","Imports NZ butter (higher fat %). Sandwiches weekdays only. Jazz nights. Breakfast sandwich overpriced"],
["Tartelette","f","French café & bakery","Old Ottawa East (Main St)","$","Y","Y","INCREDIBLE croissants"],
["Union Café","f","Café","New Edinburgh","$$","Y","Y"],
["Moca Loca","f","Café","Gatineau","$","Y","Y"],

["Arlington Five","f","Café & bakery","Centretown","$","N","M","Coffee / breakfast"],
["Ten Toes Coffee House","f","Café","Trainyards location only","$","Y","M","Coffee","Only the Trainyards location is good"],
["Sterling / Apothecary","x","","","","Y","N","","Overpriced food (that sucks) and drinks that barely contain alcohol"],
["Giovanni","x","","","","Y","N","","Food absolutely sucks. They charge for water + service"],
["Orée du Bois","x","","","","Y","N","","Food genuinely sucks AND is overpriced"],
["Kettlemans","x","","","","Y","N","","Bobino is better"],
["Bar Lupulus","x","","","","Y","N","","Tried it 2x; food was not that great"],
["La Favorita","x","","","","Y","N","","Food mid; ambiance sucks (too big)"],
["Canal Ritz","x","","","","Y","N","","Food sucks and too family vibes, but only went once so I'm open"],

["Shawarma Palace","x","","","","Y","N"]];
const K="our-eats-v1",$=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const orig=()=>D.map((r,i)=>({id:i+1,name:r[0],cats:r[1],type:r[2],loc:r[3],price:r[4],tried:r[5],go:r[6],known:r[7]||"",notes:r[8]||"",rating:0,web:"",img:""}));
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!Array.isArray(S))S=orig();
S.forEach(p=>{p.web=p.web||"";p.img=p.img||""});
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S));return true}catch(e){alert("Storage is full. Remove a few photos or restore a smaller backup.");return false}};
const TABS=[["all","All"],["d","Date night"],["c","Chill"],["t","Takeout"],["b","Bars"],["kf","Brunch & cafés"],["x","Avoid"]];
const st={tab:"all",q:"",t:"",g:"",s:"n"};let cur=null,editId=null,shown=[];
const inTab=(p,k)=>k=="all"?!p.cats.includes("x"):[...k].some(c=>p.cats.includes(c));
const city=p=>/Gatineau|Aylmer|Hull/.test(p.loc)?"Gatineau QC":/Chelsea/.test(p.loc)?"Chelsea QC":"Ottawa ON";
const mapUrl=p=>"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(p.name+" "+city(p));
const webUrl=p=>p.web?(/^https?:/.test(p.web)?p.web:"https://"+p.web):"https://www.google.com/search?q="+encodeURIComponent(p.name+" "+city(p)+" restaurant");
const meta=p=>[p.type,p.loc,p.price].filter(Boolean).map(esc).join(" · ");

const GOL={Y:"Would go",M:"Maybe",N:"Not keen"};
function item(p){
 const x=p.cats.includes("x"),g=p.go;
 const stars=[1,2,3,4,5].map(v=>`<button class="mst${p.rating>=v?" on":""}" data-a="rate" data-v="${v}" aria-label="Rate ${v}">★</button>`).join("");
 return `<tr class="g${g}" data-id="${p.id}"><td>${p.img?`<span class="pic" style="background-image:url(${p.img})"></span>`:""}<button class="nm" data-a="open">${esc(p.name)}</button></td><td>${esc(p.type)}</td><td>${esc(p.loc)}</td><td>${esc(p.price)}</td>
<td class="wide">${esc(p.known)}${p.notes?`<div class="nt">${esc(p.notes)}</div>`:""}</td>
<td><button class="pill ${p.tried=="Y"?"Y":""}" data-a="tried">${p.tried=="Y"?"✓ Tried":"Not yet"}</button></td>
<td><button class="pill ${g}" data-a="go">${x?"Avoid":GOL[g]}</button></td><td class="ms">${stars}</td>
<td><a href="${mapUrl(p)}" target="_blank" rel="noopener">Map</a><a href="${esc(webUrl(p))}" target="_blank" rel="noopener">${p.web?"Site":"Find site"}</a></td></tr>`}

function render(){
 const q=st.q.toLowerCase();
 const base=S.filter(p=>(!st.t||p.tried==st.t)&&(!st.g||p.go==st.g)&&(!q||[p.name,p.type,p.loc,p.price,p.known,p.notes].join(" ").toLowerCase().includes(q)));
 $("#th").innerHTML=[["n","Place"],["y","Cuisine"],["a","Area"],["","Price"],["","Known for & notes"],["","Tried"],["g","Would go"],["r","Top rated"],["","Links"]].map(([k,l])=>`<th>${k?`<button class="hb${st.s==k?" on":""}" data-s="${k}">${l}${st.s==k?" ▾":""}</button>`:l}</th>`).join("");
 $("#tabs").innerHTML=TABS.map(([k,l])=>`<button class="tab${st.tab==k?" on":""}" data-tab="${k}">${l}</button>`).join("");
 const o={Y:0,M:1,N:2},n=(a,b)=>a.name.localeCompare(b.name);
 const r=base.filter(p=>q?true:inTab(p,st.tab)).filter(p=>!q||inTab(p,st.tab)||st.tab=="all").sort((a,b)=>st.s=="r"?(b.rating-a.rating)||n(a,b):st.s=="g"?(o[a.go]-o[b.go])||n(a,b):st.s=="y"?a.type.localeCompare(b.type)||n(a,b):st.s=="a"?a.loc.localeCompare(b.loc)||n(a,b):n(a,b));
 $("#list").innerHTML=r.length?r.map(item).join(""):`<tr><td colspan="9" class="empty">Nothing here. Try another tab or filter, or add a place.</td></tr>`;
 shown=r;$("#cnt").textContent=r.length+" place"+(r.length==1?"":"s");
}
function sheet(){
 const p=S.find(x=>x.id==cur);if(!p)return;
 const stars=[1,2,3,4,5].map(v=>`<button class="st${p.rating>=v?" on":""}" data-a="rate" data-v="${v}" aria-label="Rate ${v}">★</button>`).join("");
 const seg=(a,cur,opts)=>`<div class="seg">${opts.map(([v,l])=>`<button class="${cur==v?"on":""}" data-a="${a}" data-v="${v}">${l}</button>`).join("")}</div>`;
 $("#sh").innerHTML=`<div class="sp">${p.img?`<div class="hero" style="background-image:url(${p.img})"></div>`:""}
<h2>${esc(p.name)}</h2><div class="sub">${meta(p)||"&nbsp;"}</div>
<div class="big">${stars}</div>
<div class="lbl">Tried it?</div>${seg("tried",p.tried,[["N","Not yet"],["Y","Tried"]])}
<div class="lbl">Would go?</div>${seg("go",p.go,[["Y","Yes"],["M","Maybe"],["N","No"]])}
${p.known?`<p class="txt">${esc(p.known)}</p>`:""}${p.notes?`<p class="txt mute">${esc(p.notes)}</p>`:""}
<div class="links"><a href="${mapUrl(p)}" target="_blank" rel="noopener">Open in Maps</a><a href="${esc(webUrl(p))}" target="_blank" rel="noopener">${p.web?"Website":"Find website"}</a></div>
<div class="foot"><span><label class="lk" style="display:inline;margin:0;font-size:14px">${p.img?"Change photo":"Add photo"}<input type="file" accept="image/*" hidden id="ph"></label>${p.img?` &nbsp;<button class="lk" data-a="rmph">Remove</button>`:""}</span>
<span><button data-a="edit">Edit</button> &nbsp; <button data-a="del">Delete</button> &nbsp; <button data-a="close" style="color:var(--ink);font-weight:600">Done</button></span></div></div>`;
}
function openSheet(id){cur=id;sheet();$("#sh").showModal()}
function resize(file,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,640/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",.72))};im.src=r.result};r.readAsDataURL(file)}

$("#list").onclick=e=>{
 const c=e.target.closest("tr");if(!c||e.target.closest("a"))return;
 const id=+c.dataset.id,b=e.target.closest("[data-a]"),a=b&&b.dataset.a,p=S.find(x=>x.id==id);
 if(a=="rate")p.rating=p.rating==+b.dataset.v?0:+b.dataset.v;
 else if(a=="tried")p.tried=p.tried=="Y"?"N":"Y";
 else if(a=="go")p.go={Y:"M",M:"N",N:"Y"}[p.go];
 else return openSheet(id);
 save();render();
};
$("#tabs").onclick=e=>{const b=e.target.closest("[data-tab]");if(b){st.tab=b.dataset.tab;render()}};
$("#q").oninput=e=>{st.q=e.target.value;render()};
$("#ft").onchange=e=>{st.t=e.target.value;render()};
$("#fg").onchange=e=>{st.g=e.target.value;render()};
$("#th").onclick=e=>{const b=e.target.closest("[data-s]");if(b){st.s=b.dataset.s;render()}};
$("#rnd").onclick=()=>{const c=shown.filter(p=>p.tried=="N"&&p.go=="Y"),a=c.length?c:shown;if(a.length)openSheet(a[Math.floor(Math.random()*a.length)].id)};
$("#sh").onclick=e=>{
 const b=e.target.closest("[data-a]");if(!b)return;
 const p=S.find(x=>x.id==cur),a=b.dataset.a,v=b.dataset.v;
 if(a=="close")return $("#sh").close();
 if(a=="edit"){$("#sh").close();return openEd(cur)}
 if(a=="del"){if(!confirm(`Delete "${p.name}"?`))return;S=S.filter(x=>x.id!=cur);save();$("#sh").close();return render()}
 if(a=="rate")p.rating=p.rating==+v?0:+v;
 if(a=="tried")p.tried=v;if(a=="go")p.go=v;if(a=="rmph")p.img="";
 save();sheet();render();
};
$("#sh").onchange=e=>{if(e.target.id!="ph"||!e.target.files[0])return;resize(e.target.files[0],d=>{const p=S.find(x=>x.id==cur),old=p.img;p.img=d;if(!save())p.img=old;sheet();render()})};
$("#sh").addEventListener("click",e=>{if(e.target==$("#sh"))$("#sh").close()});

function openEd(id){
 editId=id;const p=id?S.find(x=>x.id==id):{name:"",cats:/^[a-z]$/.test(st.tab)?st.tab:"d",type:"",loc:"",price:"",web:"",known:"",notes:""};
 $("#eh").textContent=id?"Edit place":"Add place";
 $("#fn").value=p.name;$("#fy").value=p.type;$("#fa").value=p.loc;$("#fp").value=p.price;$("#fw").value=p.web;$("#fk").value=p.known;$("#fno").value=p.notes;
 $("#fc").innerHTML=Object.entries(CATS).map(([k,l])=>`<label><input type="checkbox" value="${k}"${p.cats.includes(k)?" checked":""}>${l}</label>`).join("");
 $("#ed").showModal();
}
$("#add").onclick=()=>openEd(null);
$("#ec").onclick=()=>$("#ed").close();
$("#es").onclick=()=>{
 const name=$("#fn").value.trim();if(!name){$("#fn").focus();return}
 const cats=[...document.querySelectorAll("#fc input:checked")].map(i=>i.value).join("")||"d";
 const v={name,cats,type:$("#fy").value.trim(),loc:$("#fa").value.trim(),price:$("#fp").value.trim(),web:$("#fw").value.trim(),known:$("#fk").value.trim(),notes:$("#fno").value.trim()};
 let id=editId;
 if(id)Object.assign(S.find(x=>x.id==id),v);else{id=Math.max(0,...S.map(x=>x.id))+1;S.push({id,tried:"N",go:"Y",rating:0,img:"",...v})}
 save();$("#ed").close();render();openSheet(id);
};
$("#bk").onclick=()=>{$("#bt").value=JSON.stringify(S);$("#bd").showModal()};
$("#bc").onclick=()=>$("#bd").close();
$("#bl").onclick=()=>{try{const d=JSON.parse($("#bt").value);if(!Array.isArray(d)||!d.every(x=>x&&x.name&&typeof x.cats=="string"))throw 0;S=d;S.forEach(p=>{p.web=p.web||"";p.img=p.img||""});save();render();$("#bd").close()}catch(e){alert("That doesn't look like a backup. Copy the full text from this box and try again.")}};
$("#br").onclick=()=>{if(confirm("Replace your list with the original? Your edits, ratings and photos will be lost.")){S=orig();save();render();$("#bd").close()}};
render();
</script></body></html>
